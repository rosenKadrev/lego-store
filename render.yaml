# Render Blueprint: the shop as a static site, deployed on every push to main
services:
  - type: web
    name: tuhlensvyat
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist/lego-store/browser
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "24"
    # SPA: any path without a matching file (e.g. /product/123 on reload) gets index.html
    routes:
      # Generated from the database by the `sitemap` Edge Function (rules apply in order)
      - type: rewrite
        source: /sitemap.xml
        destination: https://wagtffhpvowbybhqpwfj.supabase.co/functions/v1/sitemap
      # Product pages prerendered at build (scripts/prerender-products.mjs); Render doesn't serve a
      # folder's index.html without the trailing slash on its own
      - type: rewrite
        source: /p/*
        destination: /p/*/index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
