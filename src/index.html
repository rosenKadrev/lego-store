<!doctype html>
<html lang="bg">
  <head>
    <meta charset="utf-8" />
    <title>MBR BrickStore — нови и употребявани LEGO® сетове</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Нови и употребявани LEGO® сетове и минифигурки. Плащане с наложен платеж." />
    <meta name="theme-color" content="#d01012" />
    <script>
      // Apply the saved/OS theme before first paint (see ThemeService) so dark mode doesn't flash white
      try {
        var t = JSON.parse(localStorage.getItem('theme'));
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rubik:wght@500;700;800&display=swap&subset=cyrillic"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
